name: EA Health Monitor

# Exécute 4×/jour aux heures précises : 00:23, 06:23, 12:23, 18:23 UTC
on:
  schedule:
    - cron: '23 0 * * *'   # 00:23 UTC
    - cron: '23 6 * * *'   # 06:23 UTC
    - cron: '23 12 * * *'  # 12:23 UTC
    - cron: '23 18 * * *'  # 18:23 UTC

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EA health monitor
        run: python3 scripts/ea_health_monitor.py
        env:
          TZ: UTC
