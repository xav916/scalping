name: EA Health Check (4×/day)

on:
  schedule:
    # Run at 00:23, 06:23, 12:23, 18:23 UTC
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run EA health check
        run: bash monitoring/ea-health-check.sh
        # ⛔ Depuis l audit S-1, ce script n a PLUS de jeton par defaut : il
        # sort en erreur si la variable manque (c est voulu). Sans cette
        # ligne il echouerait donc 4 fois par jour, en silence pour qui ne
        # lit pas les runs.
        #
        # ⚠️ Le secret INFRA_NOTIFY_TOKEN doit etre cree dans GitHub :
        # Settings > Secrets and variables > Actions > New repository secret.
        # Meme valeur que dans le .env de l EC2.
        env:
          INFRA_NOTIFY_TOKEN: ${{ secrets.INFRA_NOTIFY_TOKEN }}

      - name: Archive health logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-logs
          path: monitoring/health-checks.log
          retention-days: 30
